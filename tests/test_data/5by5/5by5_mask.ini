[input]
ground_elevation = z@5by5
friction = n@5by5
water_depth = start_h@5by5

[time]
duration = 00:01:00
record_step = 00:00:30

[output]
prefix = out_5by5
values = water_depth, water_surface_elevation, flow_speed, max_flow_speed, flow_velocity_direction, flow_rate_x, flow_rate_y

[statistics]
stats_file = 5by5.csv

[options]
hmin = 0.001
dtmax = 0.3
cfl = 0.2

[grass]
region = 3by5
mask = 5by3
